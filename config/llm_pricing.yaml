# LLM prices in USD per million tokens, used for cost accounting (ops_runs.est_cost_eur).
#
# STATUS: verified against the official pricing page on 2026-11-26 (during
# `copilot llm check-models`). cache_write is the 5-minute cache write price.
# Claude Haiku 5.5 prices are those for prompts up to 100,000 tokens; prompts over that pay
# higher prices ($0.50 input / $2.50 output), which no copilot prompt reaches.
status: verified
verified_on: 2026-11-26
source: https://platform.claude.com/docs/en/about-claude/pricing
usd_per_mtok:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
    cache_write: 2.50
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
