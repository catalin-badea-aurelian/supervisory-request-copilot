id: settled_volume_eur
version: 1.0.0
status: approved
name: "Settled volume (EUR)"
owner: "Payments Risk Oversight (fictional role)"
definition: >
  Sum of the amounts (EUR) of settled transactions. A transaction is settled when its final status is settled or refunded; authorised-only transactions are excluded.
unit: eur
attribution: transaction_month
allowed_dimensions: [period, merchant_country, mcc_group]
preferred_source: grp_merchant_monthly
independent_sources: [src_transactions, src_merchants]
sql_template: templates/settled_volume_eur.sql.j2
independent_sql_template: templates/settled_volume_eur__raw.sql.j2
reconciles_to:
  table: ledger_control_totals
  measures: [settled_volume_eur]
checks: [V-SCH-01, V-PK-01, V-COMP-01, V-COMP-02, V-REC-01, V-DUAL-01, V-VAR-01, V-PRIOR-01, V-TIME-01, V-RERUN-01, V-SQL-01]
tolerances:
  V-DUAL-01: {relative: 0.001}
  V-VAR-01: {relative: 0.35}
  V-COMP-01: {warn: 0.001, fail: 0.01}
  V-REC-01: {relative: 0.005}
bcbs239_principles: [3, 4, 5, 7, 9]
changelog:
  - {version: 1.0.0, date: 2025-10-01, change: "Initial approved definition", approved_by: approver-01}
