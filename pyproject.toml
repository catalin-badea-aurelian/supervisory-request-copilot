[project]
name = "supervisory-request-copilot"
version = "0.1.0"
description = "Supervisory Request Copilot — a governed, agentic workflow for second-line (2LoD) risk data oversight at a fictional EU payments institution."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Catalin Badea" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.14.0",
    "duckdb>=2.0.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=1.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=6.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rich>=13",
    "sqlglot>=30.35.0",
    "typer>=0.15",
]

[project.scripts]
copilot = "copilot.cli:app"

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=3.47.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "poethepoet>=0.31",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Scoped to the code we own. docs/*.md contain illustrative Python/SQL
# snippets in fenced blocks that ruff format would otherwise try to reformat.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py", "*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# HTML and JS strings in the renderer are easier to read unwrapped
"src/copilot/dashboard/render.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not bigquery'"
markers = [
    "bigquery: needs a live BigQuery project (run manually, never in CI)",
    "slow: full-scale data generation",
]

# --------------------------------------------------------------------------
# Task runner (poethepoet). Command names match docs/CLAUDE.md exactly.
# Windows: `uv run poe <task>`. Linux/macOS/CI: `make <task>` (thin Makefile
# that delegates to the same poe task) — see CLAUDE.md "Development
# environment". Every task not yet implemented fails loudly (exit 1) rather
# than silently succeeding, so a milestone can never be skipped by accident.
# --------------------------------------------------------------------------

[tool.poe.tasks]

[tool.poe.tasks.setup]
help = "uv sync + pre-commit install"
sequence = ["_setup-sync", "_setup-precommit"]

[tool.poe.tasks._setup-sync]
cmd = "uv sync"
help = "Internal: sync dependencies"

[tool.poe.tasks._setup-precommit]
cmd = "pre-commit install"
help = "Internal: install pre-commit hooks"

[tool.poe.tasks.test]
cmd = "pytest"
help = "pytest (no network, no LLM calls)"

[tool.poe.tasks.bq-setup]
cmd = "python scripts/bq_setup.py"
help = "Print the BigQuery setup plan (dry run); add --apply to create EU datasets, access and tables"

[tool.poe.tasks.data]
cmd = "python -m data.generator --target ${target}"
help = "Generate synthetic data, seed 42 (defects planted)"
args = [{ name = "target", options = ["--target"], default = "bigquery", help = "bigquery (default, showcase) or duckdb (local)" }]

[tool.poe.tasks.data-clean]
script = "data.generator.__main__:data_clean_task(target, force)"
help = "Same as data, without planted defects (for bigquery it refuses unless --force is given)"
args = [
  { name = "target", options = ["--target"], default = "bigquery", help = "bigquery (default, showcase) or duckdb (local)" },
  { name = "force", options = ["--force"], type = "boolean", default = false, help = "allow overwriting the demo dataset in BigQuery" },
]

[tool.poe.tasks.views]
cmd = "python -m copilot.cli views"
help = "Generate mart views from the domain pack (dashboards/views/) and deploy them to spb_marts (as the owner)"

[tool.poe.tasks.lookml]
cmd = "python -m copilot.cli lookml"
help = "Generate LookML (views, explores, model, dashboards) from the domain pack into looker/"

[tool.poe.tasks.lookml-publish]
cmd = "python scripts/looker_required.py lookml-publish"
help = "Push looker/ to the Looker project repo (requires a Looker instance; optional, ADR 016)"

[tool.poe.tasks.lookml-check]
cmd = "python scripts/looker_required.py lookml-check"
help = "Validate the LookML project and run the consistency test through Looker (requires a Looker instance; optional, ADR 016)"

[tool.poe.tasks.dashboard]
cmd = "python -m copilot.cli dashboard build"
help = "Build the oversight dashboard: spec, candidate HTML and tile reconciliation (--scan for the latest scan); then copilot gate GD"

[tool.poe.tasks.verify-iam]
cmd = "python scripts/verify_iam.py"
help = "Prove least privilege on BigQuery: denied writes, denied reads, SQL policy, byte limit, snapshots and the ADR 014 residual (--only to select)"

[tool.poe.tasks.corpus]
cmd = "python scripts/fetch_corpus.py"
help = "Fetch and index the BCBS 239 corpus (not yet implemented, lands in M5)"

[tool.poe.tasks.eval]
cmd = "python scripts/_stub.py eval M7"
help = "Evaluation harness -> evals/REPORT.md (not yet implemented, lands in M7)"

[tool.poe.tasks.demo]
cmd = "python -m copilot.cli demo"
help = "Run S1 and S2 end to end with scripted answers (replay: recorded LLM responses, no API calls; add --record to call the API and re-record)"
